# Reviewers teach the agent by commenting "/lesson <rule>" on any PR.
# Each lesson arrives as a small PR against .github/instructions/lessons.instructions.md.
name: Story-to-PR lessons

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  lesson:
    if: >-
      contains(github.event.comment.body, '/lesson') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # default branch
      - uses: ravitejabandaru/story-to-pr-agent/actions/lessons@v1

# Pre-builds the agent's environment before it starts, so it doesn't spend tokens and
# minutes discovering how to install dependencies (or failing and retrying).
# Must live on the default branch; the job name must be exactly `copilot-setup-steps`.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest        # use a larger runner label if builds are slow
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Warm up checks (fails fast if the environment is broken)
        run: npm run agent:check || true

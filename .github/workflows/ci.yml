name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Readiness linter demo
        run: npm run readiness:demo
      - name: Lifecycle demo
        run: npm run lifecycle:demo
      - name: Guardrails on a good PR (must pass)
        run: node src/guardrails/cli.js --pr examples/prs/good-pr.json
      - name: Guardrails on a bad PR (must fail)
        run: "! node src/guardrails/cli.js --pr examples/prs/bad-pr.json"
